version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
    groups:
      all-but-ktor-minor-updates:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "io.ktor*"
      ktor-minor-updates:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "io.ktor*"

  -  package-ecosystem: github-actions
     directory: "/"
     schedule:
       interval: "weekly"
       day: "monday"
       time: "06:00"
       timezone: "Europe/Oslo"
     cooldown:
       default-days: 7
     groups:
       all-minor-updates:
         update-types:
           - "minor"
           - "patch"
